# Server-side compose for oura-dashboard
# Managed by lara — do not edit manually on the server
#
# App configuration and secrets come from mounted appsettings.json.
# .env only supplies values needed by the postgres container itself.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: oura
      POSTGRES_USER: oura
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - /srv/oura-dashboard/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oura -d oura"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: lara:5000/oura-dashboard:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - /srv/oura-dashboard/appsettings.json:/app/appsettings.json:ro
      - /srv/oura-dashboard/data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    environment:
      TZ: "Europe/Tallinn"
    depends_on:
      postgres:
        condition: service_healthy
